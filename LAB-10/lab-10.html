<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multimedia Player</title>
</head>

<body>

  <h1>My Multimedia Player</h1>

  <section>
    <h2>Sailing Away</h2>

    <audio controls aria-label="Sailing Away audio">
      <source
        src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
        type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>What Is the Map Method?</h2>

    <video
      controls
      width="600"
      aria-label="What is the map method and how does it work">

      <source
        src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
        type="video/mp4">

      <track
        src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
        kind="subtitles"
        srclang="en"
        label="English">
    </video>
  </section>

  <section>
    <h2>Transcript</h2>

    <p>
      This video explains the JavaScript map method and how it can be used
      to create a new array by applying a function to every element of an
      existing array.
    </p>
  </section>

</body>
</html>
